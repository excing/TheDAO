<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Theme Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.6" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients representing Dynamic Flow without Ownership -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>

    <linearGradient id="flowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="50%" stop-color="#B92B27" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>

    <radialGradient id="centerAperture" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#7F00FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Energy Halo -->
  <circle cx="256" cy="256" r="180" fill="url(#centerAperture)" />

  <!-- Outer Orbit Rings (Decentralized Consensus Mesh) -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#4FACFE" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7F00FF" stroke-width="1" stroke-dasharray="2 12" opacity="0.3" />

  <!-- Tripartite Möbius / Trefoil Loop (生而不有，长而不宰: Decentralization, Disownership, Autonomous Emergence) -->
  <g filter="url(#glow)">
    <!-- Loop Strand A -->
    <path d="M 256,100 
             C 340,100 410,170 410,256 
             C 410,320 370,360 310,360 
             C 230,360 170,220 256,100 Z" 
          fill="none" 
          stroke="url(#flowGrad1)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9" />

    <!-- Loop Strand B (Interlocking 120 deg rotation) -->
    <path d="M 120,335 
             C 80,260 115,160 190,116 
             C 245,84 290,105 320,157 
             C 360,227 220,330 120,335 Z" 
          fill="none" 
          stroke="url(#flowGrad1)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.85" />

    <!-- Loop Strand C (Interlocking 240 deg rotation) -->
    <path d="M 392,335 
             C 348,410 248,445 174,402 
             C 120,370 120,315 150,263 
             C 190,193 330,280 392,335 Z" 
          fill="none" 
          stroke="url(#flowGrad1)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.85" />
  </g>

  <!-- Flow Core Infill / High-Intensity Ribbon Highlights -->
  <g opacity="0.75">
    <path d="M 256,106 C 334,106 404,174 404,256 C 404,316 366,354 310,354 C 234,354 176,220 256,106 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 126,331 C 88,260 121,166 192,123 C 243,92 285,112 314,161 C 352,228 220,326 126,331 Z" 
          fill="none" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 386,331 C 344,404 250,438 178,397 C 128,367 128,315 156,267 C 194,200 328,280 386,331 Z" 
          fill="none" stroke="#E0C3FC" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Distributed Consensus Network Nodes -->
  <g filter="url(#glow)">
    <!-- Vertex Node 1 (Top) -->
    <circle cx="256" cy="100" r="10" fill="#FFFFFF" />
    <circle cx="256" cy="100" r="16" fill="none" stroke="#00F2FE" stroke-width="3" opacity="0.8" />

    <!-- Vertex Node 2 (Bottom Left) -->
    <circle cx="120" cy="335" r="10" fill="#FFFFFF" />
    <circle cx="120" cy="335" r="16" fill="none" stroke="#7F00FF" stroke-width="3" opacity="0.8" />

    <!-- Vertex Node 3 (Bottom Right) -->
    <circle cx="392" cy="335" r="10" fill="#FFFFFF" />
    <circle cx="392" cy="335" r="16" fill="none" stroke="#4FACFE" stroke-width="3" opacity="0.8" />

    <!-- Harmonic Midpoint Satellites -->
    <circle cx="256" cy="256" r="6" fill="#00F2FE" />
    <circle cx="350" cy="180" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="162" cy="180" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="256" cy="385" r="5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
