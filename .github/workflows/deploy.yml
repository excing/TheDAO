name: Deploy Starlight Documentation to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_TITLE: "The DAO"
  CLOUDFLARE_PROJECT_NAME: "thedao"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scaffold Starlight and prepare content
        run: |
          echo "==> 1. Initializing Starlight project..."
          npx --yes create-astro@latest .starlight-build --template starlight --yes --no-git --no-install
          
          cd .starlight-build
          npm install
          cd ..

          echo "==> 2. Resetting default template docs..."
          rm -rf .starlight-build/src/content/docs/*

          echo "==> 3. Syncing repository markdown files and assets..."
          rsync -av --exclude='.git' --exclude='.github' --exclude='.starlight-build' ./ .starlight-build/src/content/docs/

          echo "==> 4. Ensuring single landing page and preventing duplicate entries..."
          if [ -f .starlight-build/src/content/docs/README.md ]; then
            if [ ! -f .starlight-build/src/content/docs/index.md ] && [ ! -f .starlight-build/src/content/docs/index.mdx ]; then
              mv .starlight-build/src/content/docs/README.md .starlight-build/src/content/docs/index.md
            else
              rm -f .starlight-build/src/content/docs/README.md
            fi
          fi

          echo "==> 5. Syncing branding assets if present..."
          mkdir -p .starlight-build/src/assets
          for ext in svg png webp; do
            if [ -f "logo.${ext}" ]; then
              cp "logo.${ext}" .starlight-build/src/assets/
            fi
            if [ -f "assets/logo.${ext}" ]; then
              cp "assets/logo.${ext}" .starlight-build/src/assets/
            fi
          done

          echo "==> 6. Configuring Starlight (custom astro.config.mjs or fallback)..."
          if [ -f astro.config.mjs ]; then
            echo "Using custom astro.config.mjs from repository root..."
            cp astro.config.mjs .starlight-build/astro.config.mjs
          else
            echo "No custom astro.config.mjs found, generating progressive default config..."
            cat << 'EOF' > .starlight-build/astro.config.mjs
            import { defineConfig } from 'astro/config';
            import starlight from '@astrojs/starlight';
            import fs from 'node:fs';

            const detectedLogo = fs.existsSync('./src/assets/logo.svg')
              ? './src/assets/logo.svg'
              : fs.existsSync('./src/assets/logo.png')
              ? './src/assets/logo.png'
              : undefined;

            export default defineConfig({
              integrations: [
                starlight({
                  title: process.env.SITE_TITLE || 'The DAO',
                  ...(detectedLogo ? { logo: { src: detectedLogo } } : {}),
                  social: {
                    github: 'https://github.com/excing/TheDAO',
                  },
                }),
              ],
            });
            EOF
          fi

          echo "==> 7. Normalizing Frontmatter metadata and deduplicating main headings..."
          node - << 'EOF'
          const fs = require('fs');
          const path = require('path');

          function processDirectory(dirPath) {
            const entries = fs.readdirSync(dirPath, { withFileTypes: true });
            for (const entry of entries) {
              const fullPath = path.join(dirPath, entry.name);
              if (entry.isDirectory()) {
                processDirectory(fullPath);
              } else if (entry.name.endsWith('.md') || entry.name.endsWith('.mdx')) {
                let content = fs.readFileSync(fullPath, 'utf8');
                let title = '';

                if (!content.startsWith('---')) {
                  // Case 1: No frontmatter present. Extract H1 or fallback to filename.
                  const headingMatch = content.match(/^#\s+(.+)$/m);
                  title = headingMatch ? headingMatch[1].trim() : path.parse(entry.name).name;
                  let body = content;
                  if (headingMatch) {
                    body = body.replace(/^\s*#\s+[^\r\n]+[\r\n]*/m, '');
                  }
                  content = `---\ntitle: "${title.replace(/"/g, '\\"')}"\n---\n\n` + body.trimStart();
                } else {
                  // Case 2: Frontmatter exists. Ensure title is present and strip duplicate H1 from body.
                  const endIdx = content.indexOf('---', 3);
                  if (endIdx !== -1) {
                    let frontmatter = content.slice(3, endIdx);
                    let body = content.slice(endIdx + 3);

                    const titleMatch = frontmatter.match(/^\s*title\s*:\s*["']?(.*?)["']?\s*$/m);
                    if (titleMatch) {
                      title = titleMatch[1].trim();
                    } else {
                      const headingMatch = body.match(/^#\s+(.+)$/m);
                      title = headingMatch ? headingMatch[1].trim() : path.parse(entry.name).name;
                      frontmatter = `\ntitle: "${title.replace(/"/g, '\\"')}"` + frontmatter;
                    }

                    // Remove redundant H1 from body if it matches the page title
                    const trimmedBody = body.trimStart();
                    const leadingHeadingMatch = trimmedBody.match(/^#\s+(.+)$/m);
                    if (leadingHeadingMatch && leadingHeadingMatch[1].trim() === title) {
                      body = body.replace(/^\s*#\s+[^\r\n]+[\r\n]*/m, '');
                    }

                    content = `---${frontmatter}\n---\n` + body;
                  }
                }

                fs.writeFileSync(fullPath, content, 'utf8');
              }
            }
          }

          processDirectory(path.join(process.cwd(), '.starlight-build/src/content/docs'));
          EOF

      - name: Build static site
        run: |
          cd .starlight-build
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 GitHub Secret: CLOUDFLARE_API_TOKEN，请前往仓库 Settings -> Secrets and variables -> Actions 添加！"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 GitHub Secret: CLOUDFLARE_ACCOUNT_ID，请前往仓库 Settings -> Secrets and variables -> Actions 添加！"
            exit 1
          fi

          echo "==> 1. Ensuring Pages project exists on Cloudflare..."
          npx wrangler pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main || true

          echo "==> 2. Deploying build artifacts to Cloudflare Pages..."
          npx wrangler pages deploy .starlight-build/dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main

